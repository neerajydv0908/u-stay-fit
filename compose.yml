# Optional local PostgreSQL. This does not replace or migrate the embedded database.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: u_stay_fit
      POSTGRES_USER: u_stay_fit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local-only PostgreSQL password in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - local_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U u_stay_fit -d u_stay_fit"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  local_postgres:
